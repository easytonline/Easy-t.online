<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>easy t.online</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background:#ffffff;
    overflow:hidden;
}

/* خلفية */
.bg-blur{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#ffe5e5 0%,#ffffff 45%,#f5f5f5 100%);
    background-size:cover;
    background-position:center;
    filter:blur(12px);
    z-index:-2;
}

/* الدائرة */
.plinko-circle{
    position:fixed;
    width:420px;
    height:420px;
    background:radial-gradient(circle,#ff4b4b,#c40000);
    border-radius:50%;
    top:15%;
    left:50%;
    transform:translateX(-50%);
    opacity:.16;
    filter:blur(3px);
    z-index:-1;
}

.container{
    max-width:420px;
    margin:80px auto;
    background:rgba(255,255,255,.88);
    border-radius:18px;
    padding:22px;
    color:#222;
    text-align:center;
    border:1px solid rgba(220,0,0,.18);
    box-shadow:0 10px 35px rgba(180,0,0,.12);
}

/* العنوان */

h1{
    font-size:28px;
    margin-bottom:6px;
}

p{
    opacity:.9;
}

/* المعلومات */

.info{
    background:#fff5f5;
    padding:12px;
    border-radius:12px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    font-size:20px;
    border:1px solid #ffd6d6;
}

.info b{
    color:#d40000;
}

/* الزر */

.btn-main{
    background:#e00000;
    border:none;
    padding:14px 25px;
    font-size:18px;
    border-radius:12px;
    color:#fff;
    cursor:pointer;
    width:100%;
    transition:.3s;
    box-shadow:0 7px 18px rgba(224,0,0,.2);
}

.btn-main:hover{
    background:#b90000;
}

/* حركة العنوان */

@keyframes glowMove{

0%{
    text-shadow:0 0 8px #ff5555,
                0 0 16px #ff5555;
    transform:translateX(0);
}

50%{
    text-shadow:0 0 18px #ff5555,
                0 0 35px #ff5555;
    transform:translateX(10px);
}

100%{
    text-shadow:0 0 8px #ff5555,
                0 0 16px #ff5555;
    transform:translateX(0);
}

}

.plinko-anim{
    animation:glowMove 2.5s infinite ease-in-out;
}

/* حركة السهم */

@keyframes arrowMove{

0%{
    transform:translateY(0);
    filter:drop-shadow(0 0 6px #e00000);
}

50%{
    transform:translateY(-8px);
    filter:drop-shadow(0 0 14px #e00000);
}

100%{
    transform:translateY(0);
    filter:drop-shadow(0 0 6px #e00000);
}

}

.arrow-anim{
    display:inline-block;
    animation:arrowMove 1.2s infinite ease-in-out;
}

/* حركة مبروك */

@keyframes mabrookMove{

0%{
    transform:translateX(0);
}

50%{
    transform:translateX(8px);
}

100%{
    transform:translateX(0);
}

}

.mabrook-anim{
    animation:mabrookMove 2s infinite ease-in-out;
}

</style>

</head>


<body>

<script>

function closeModal(){

</script>


</body>
</html>
