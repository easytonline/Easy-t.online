<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>easy t.online</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f2f2f2;
    font-family:Arial,Tahoma,sans-serif;
    color:#222;
}

.app{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

/* HEADER */

header{
    padding:18px 15px;
    text-align:center;
    background:#fff;
    border-bottom:1px solid #eee;
}

.logo{
    width:190px;
    max-width:80%;
}

/* CONTENT */

.content{
    padding:15px;
}

.card{
    background:#fff;
    border-radius:16px;
    border:1px solid #e8e8e8;
    padding:20px;
    margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

/* TITLE */

.title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#e3262e;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#777;
    font-size:14px;
    line-height:1.7;
}

/* BALANCE */

.balance{
    background:#e3262e;
    color:white;
    text-align:center;
    border-radius:16px;
    padding:24px 15px;
    margin-bottom:14px;
}

.balance small{
    display:block;
    font-size:14px;
    margin-bottom:8px;
}

.balance strong{
    display:block;
    font-size:38px;
}

.balance span{
    font-size:17px;
}

/* STATUS */

.status{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.status-label{
    color:#777;
}

.status-value{
    color:#159447;
    font-weight:bold;
}

/* BUTTON */

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:16px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#e3262e;
    color:#fff;
    box-shadow:0 6px 15px rgba(227,38,46,.2);
}

.primary:active{
    transform:scale(.98);
}

/* FORM */

.form{
    display:none;
}

.form.active{
    display:block;
}

.form h2{
    margin:0 0 15px;
    text-align:center;
    color:#e3262e;
}

.warning{
    background:#fff3f3;
    color:#777;
    border-radius:11px;
    padding:12px;
    text-align:center;
    font-size:13px;
    line-height:1.7;
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#e3262e;
}

.secondary{
    background:#222;
    color:#fff;
}

/* NOTICE */

.notice{
    text-align:center;
    color:#888;
    font-size:12px;
    line-height:1.7;
    padding:10px 15px 25px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:20px;
    color:#aaa;
    font-size:12px;
    border-top:1px solid #eee;
}

footer b{
    color:#e3262e;
}
</style>
</head>

<body>

<div class="app">

<header>

<img
    class="logo"
    src="file_00000000a29481f4a3152f77d5b063e.png"
    alt="easy t.online"
>

</header>


<div class="content">


<!-- TITLE -->

<div class="card">

<div class="title">
🎉 ألف مبروك
</div>

<div class="description">
أهلًا بك في easy t.online
<br>
هذه نسخة تجريبية من الواجهة.
</div>

</div>


<!-- BALANCE -->

<div class="balance">

<small>
الرصيد التجريبي
</small>

<strong>
9,850
</strong>

<span>
جنيه
</span>

</div>


<!-- STATUS -->

<div class="card status">

<span class="status-label">
حالة الحساب
</span>

<span class="status-value">
● Demo
</span>

</div>


<!-- MAIN BUTTON -->

<button
    class="primary"
    onclick="showForm()"
>
متابعة
</button>


<!-- FORM -->

<div
    class="card form"
    id="form"
>

<h2>
طلب تجريبي
</h2>

<div class="warning">

⚠️ هذه الصفحة Demo فقط.
<br>
لا توجد أموال حقيقية أو رسوم دفع.

</div>


<label>
الاسم
</label>

<input
    type="text"
    placeholder="اكتب الاسم"
>


<label>
طريقة الاستلام
</label>

<select>

<option>
اختر الطريقة
</option>

<option>
محفظة إلكترونية
</option>

<option>
حساب بنكي
</option>

</select>


<label>
رقم الحساب
</label>

<input
    type="text"
    placeholder="اكتب رقم الحساب"
>


<button
    class="secondary"
    onclick="confirmDemo()"
>
تأكيد تجريبي
</button>

</div>


<div class="notice">

easy t.online
<br>
واجهة Demo لأغراض العرض والتجربة فقط.

</div>

</div>


<footer>

<b>easy t.online</b>
<br>
Demo Interface

</footer>

</div>


<script>

function showForm(){

    const form = document.getElementById("form");

    form.classList.add("active");

    form.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


function confirmDemo(){

    alert("تم تنفيذ العملية التجريبية بنجاح ✅");

}

</script>

</body>
</html>
