<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>easy t.online</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: #ffffff;
        overflow:hidden;
    }

/* خلفية ضبابية */
.bg-blur {
    position: fixed;
    inset: 0;
    background: url('https://i.imgur.com/1c8ZQkR.png');
    background-size: cover;
    background-position: center;
    filter: blur(12px) brightness(1);
    z-index: -2;
}

/* دائرة بلينكو كبيرة */
.plinko-circle {
    position: fixed;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, #ff5555, #cc0000);
    border-radius: 50%;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.15;
    filter: blur(3px);
    z-index: -1;
}

.container {
    max-width: 420px;
    margin: 80px auto;
    background: rgba(255,255,255,0.90);
    border-radius: 18px;
    padding: 22px;
    color: #222;
    text-align: center;
    border: 1px solid rgba(220,0,0,0.20);
    backdrop-filter: blur(12px);
}

h1 { font-size: 28px; margin-bottom: 6px; }
p { opacity: 0.9; }

.info {
    background: rgba(220,0,0,0.06);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
}

.info b {
    color: #d40000;
}

.btn-main {
    background: #e00000;
    border: none;
    padding: 14px 25px;
    font-size: 18px;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
    width: 100%;
    transition: 0.3s;
}
.btn-main:hover{ background:#c00000; }

@keyframes glowMove {
    0% {
        text-shadow:0 0 8px #ff5555, 0 0 16px #ff5555;
        transform:translateX(0);
    }
    50% {
        text-shadow:0 0 18px #ff5555, 0 0 35px #ff5555;
        transform:translateX(10px);
    }
    100% {
        text-shadow:0 0 8px #ff5555, 0 0 16px #ff5555;
        transform:translateX(0);
    }
}

.plinko-anim {
    animation: glowMove 2.5s infinite ease-in-out;
}

@keyframes arrowMove {
    0% {
        transform:translateY(0);
        filter:drop-shadow(0 0 6px #ff3333);
    }
    50% {
        transform:translateY(-8px);
        filter:drop-shadow(0 0 14px #ff3333);
    }
    100% {
        transform:translateY(0);
        filter:drop-shadow(0 0 6px #ff3333);
    }
}

.arrow-anim {
    display:inline-block;
    animation: arrowMove 1.2s infinite ease-in-out;
}

@keyframes mabrookMove {
    0%{transform:translateX(0);}
    50%{transform:translateX(8px);}
    100%{transform:translateX(0);}
}

.mabrook-anim {
    animation:mabrookMove 2s infinite ease-in-out;
}

</style>

</head>
<body>

<h1
class="plinko-anim"
style="
font-size:42px;
text-align:center;
margin:20px 0;
font-weight:900;
color:#d40000;
letter-spacing:2px;
text-shadow:0 0 10px #ff5555, 0 0 20px #ff5555;
">
easy t.online
</h1>

<div class="bg-blur"></div>

<div class="plinko-circle"></div>

<div class="container">

    <h1
    class="mabrook-anim"
    style="
    font-size:32px;
    margin-bottom:6px;
    font-weight:900;
    color:#d40000;
    text-shadow:0 0 12px #ff9999;
    ">
    🎉 ألف مبروك 🎉
    </h1>

    <p>
    مبروك كسبت مع <b>easy t.online</b> والمكسب جاهز للسحب بمجرد دفع الرسوم
    </p>

    <div class="info">
        <span>المكسب</span>
        <b>٩٬٨٥٠ ج</b>
    </div>

    <div class="info">
        <span>الرسوم</span>
        <b>٩٨٥ ج</b>
    </div>

    <div class="info">
        <span>الحالة</span>
        <b>جاهز للسحب</b>
    </div>

    <button
    class="btn-main"
    onclick="openModal()">
    سحب المكسب
    </button>

</div>

<!-- Popup -->

<div
id="modal"
style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
backdrop-filter:blur(6px);
padding:20px;
z-index:999;
">

<div
style="
max-width:420px;
margin:auto;
background:rgba(255,255,255,0.95);
border:1px solid rgba(220,0,0,0.25);
border-radius:20px;
padding:25px;
color:#222;
text-align:center;
backdrop-filter:blur(12px);
">

<h2
style="
font-size:26px;
margin-bottom:10px;
color:#d40000;
">
سحب الأرباح 💰
</h2>

<p
style="
opacity:0.9;
margin-bottom:20px;
">
برجاء سداد الرسوم ليتم تحويل المكسب على محفظتك
</p>

<div
style="
text-align:right;
font-size:20px;
margin-bottom:15px;
">

<div
style="
background:rgba(220,0,0,0.06);
padding:10px;
border-radius:12px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
">

<span>المكسب</span>

<b style="color:#d40000;">
٩٬٨٥٠ ج
</b>

</div>

<div
style="
background:rgba(220,0,0,0.06);
padding:10px;
border-radius:12px;
display:flex;
justify-content:space-between;
">

<span>الرسوم</span>

<b style="color:#d40000;">
٩٨٥ ج
</b>

</div>

</div>

<button
onclick="closeModal()"
style="
margin-top:20px;
background:#e00000;
border:none;
padding:14px 20px;
font-size:18px;
border-radius:12px;
color:#fff;
width:100%;
cursor:pointer;">
تمام
</button>

<label
style="
display:block;
margin:15px 0 10px;
font-size:18px;">
ارفاق صورة:
</label>

<input
type="file"
style="
width:100%;
padding:10px;
border-radius:12px;
border:none;
background:#fff;
color:#000;
" />

<div
class="upload-note"
style="
margin-top:12px;
font-size:18px;
color:#d40000;
text-align:center;
font-weight:bold;
">

⬇️ <span class="arrow-anim">⬆️</span>
ارفع الاسكرين هنا او تواصل مع المهندس انور ع الماسنجر

</div>

</div>
</div>

<script>

function openModal(){
    document.getElementById('modal').style.display='block';
}

function closeModal(){
    document.getElementById('modal').style.display='none';
}

</script>

</body>
</html>
