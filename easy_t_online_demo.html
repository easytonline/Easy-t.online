<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy t.Online — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#071b4a,#0b56b0);color:#fff;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:18px}
.card{background:rgba(255,255,255,.97);color:#17213a;border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.28);margin-top:18px}
.brand{text-align:center;font-size:30px;font-weight:900;letter-spacing:.3px;margin:8px 0 4px}
.demo{text-align:center;color:#d33;font-size:12px;font-weight:700;margin-bottom:18px}
.hero{background:linear-gradient(135deg,#125bc5,#19a8ff);border-radius:20px;padding:22px;text-align:center}
.hero h1{margin:0 0 8px;font-size:25px}.hero p{margin:0;opacity:.95}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.box{background:#f4f7fb;border-radius:16px;padding:14px;text-align:center}.label{font-size:12px;color:#6c7588}.value{font-size:20px;font-weight:800;margin-top:5px}
button{width:100%;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;background:#0b63d1;color:#fff;margin-top:16px}
button.secondary{background:#eef3f9;color:#17477f}
.notice{font-size:12px;line-height:1.7;background:#fff7df;border:1px solid #f0d37a;border-radius:14px;padding:12px;margin-top:15px;color:#5f4a12}
.hidden{display:none}.footer{text-align:center;font-size:11px;opacity:.7;margin:18px 0}
input{width:100%;padding:13px;border:1px solid #d8deea;border-radius:12px;margin-top:8px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Easy t.Online</div>
  <div class="demo">DEMO / نموذج تجريبي</div>

  <section class="card">
    <div class="hero">
      <h1>مرحبًا بك 👋</h1>
      <p>واجهة تجريبية مستوحاة من فكرة الموقع الذي أرسلته</p>
    </div>

    <div class="grid">
      <div class="box"><div class="label">الرصيد التجريبي</div><div class="value">9,850</div></div>
      <div class="box"><div class="label">الحالة</div><div class="value">Demo</div></div>
    </div>

    <button onclick="showPanel()">متابعة</button>

    <div id="panel" class="hidden">
      <div class="notice">
        هذه نسخة تجريبية فقط. الأرقام والبيانات المعروضة غير حقيقية ولا تمثل أرباحًا أو تحويلات مالية فعلية.
      </div>

      <label style="display:block;margin-top:16px;font-weight:700">الاسم التجريبي</label>
      <input placeholder="اكتب اسمًا للتجربة">

      <label style="display:block;margin-top:14px;font-weight:700">ملاحظة</label>
      <input placeholder="اكتب ملاحظتك">

      <button class="secondary" onclick="demoAction()">إرسال تجريبي</button>
    </div>
  </section>

  <div class="footer">Easy t.Online • Demo Interface</div>
</div>

<script>
function showPanel(){
  document.getElementById('panel').classList.remove('hidden');
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function demoAction(){
  alert('تم تنفيذ العملية التجريبية فقط — لا توجد معاملة مالية حقيقية.');
}
</script>
</body>
</html>
